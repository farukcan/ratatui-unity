[package]
name = "ratatui-unity"
version = "0.1.0"
edition = "2021"
description = "A Rust native plugin that brings Ratatui's TUI ecosystem to Unity 3D game engine — for all platforms."
license = "MIT"
repository = "https://github.com/farukcan/ratatui-unity"
readme = "README.md"
keywords = ["ratatui", "tui", "unity", "terminal", "gamedev"]
categories = ["game-development", "external-ffi-bindings", "rendering"]

[lib]
name = "ratatui_unity"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = [
    "widget-calendar",
] }
fontdue = "0.9"
rustc-hash = "2"
time = { version = "0.3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"

[lints.clippy]
# The C ABI surface dereferences raw pointers inside a few safe-signature
# helper functions (state_mut, state_ref, cstr_to_string, slice_from). unsafe
# is confined to and documented inside those helpers; this lint would otherwise
# flag them. The public FFI entry points stay free of `unsafe`.
not_unsafe_ptr_arg_deref = "allow"
# Internal pixel-blit helpers legitimately take many positional args.
too_many_arguments = "allow"
# Guardrails against silent panics and undocumented unsafe.
undocumented_unsafe_blocks = "warn"
get_unwrap = "warn"
unwrap_used = "warn"
panic = "warn"
mem_replace_with_default = "warn"
