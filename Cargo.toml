[package]
name = "ratatui-unity"
version = "0.1.0"
edition = "2021"
description = "A Rust native plugin that brings Ratatui's TUI ecosystem to Unity 3D game engine — for all platforms."
license = "MIT"
repository = "https://github.com/farukcan/ratatui-unity"
readme = "README.md"
keywords = ["ratatui", "tui", "unity", "terminal", "gamedev"]
categories = ["game-development", "external-ffi-bindings", "rendering"]

[lib]
name = "ratatui_unity"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = [
    "widget-calendar",
] }
fontdue = "0.9"
rustc-hash = "2"
time = { version = "0.3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
